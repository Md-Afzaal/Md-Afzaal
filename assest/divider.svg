<svg xmlns="http://www.w3.org/2000/svg" width="800" height="14" viewBox="0 0 800 14" role="img" aria-label="section divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36BCF7" stop-opacity="1"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#36BCF7" stop-opacity="0.22"/>
      <stop offset="0.8" stop-color="#36BCF7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="800" height="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- faint static line -->
    <rect x="0" y="6" width="800" height="2" rx="1" fill="url(#fade)"/>

    <!-- soft light that slowly glides across -->
    <rect x="-240" y="5" width="240" height="4" rx="2" fill="url(#sweep)">
      <animate attributeName="x" from="-240" to="800" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- gently pulsing centre dot -->
    <circle cx="400" cy="7" r="3" fill="#36BCF7">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
